<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Ujian Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js untuk State Management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- SheetJS (xlsx) untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col" x-data="examApp()" x-init="initData()">

    <!-- Header Navigation Bar -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-800 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-xl text-indigo-200"></i>
                </div>
                <span class="font-bold text-lg sm:text-xl tracking-tight">EduTest Online</span>
            </div>

            <!-- Role Switcher -->
            <div class="flex items-center bg-indigo-900/60 p-1 rounded-xl border border-indigo-500/30">
                <button 
                    @click="switchRole('siswa')"
                    :class="role === 'siswa' ? 'bg-white text-indigo-900 shadow-sm' : 'text-indigo-200 hover:text-white'"
                    class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-user-large"></i>
                    <span>Mode Siswa</span>
                </button>
                <button 
                    @click="switchRole('guru')"
                    :class="role === 'guru' ? 'bg-white text-indigo-900 shadow-sm' : 'text-indigo-200 hover:text-white'"
                    class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>Portal Guru</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- ========================================== -->
        <!-- SISWA VIEW -->
        <!-- ========================================== -->
        <template x-if="role === 'siswa'">
            <div>
                <!-- STEP 1: FORM IDENTITAS SISWA -->
                <template x-if="studentStep === 'identity'">
                    <div class="max-w-md mx-auto my-8 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-100">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                                <i class="fa-solid fa-clipboard-user"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-800">Masuk Ujian</h2>
                            <p class="text-slate-500 text-sm mt-1">Lengkapi data diri Anda sebelum memulai ujian.</p>
                        </div>

                        <form @submit.prevent="startExam()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nama Lengkap</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" x-model="studentForm.nama" required placeholder="Contoh: Ahmad Subagja" 
                                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none text-sm transition">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Kelas</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                            <i class="fa-solid fa-school"></i>
                                        </span>
                                        <input type="text" x-model="studentForm.kelas" required placeholder="XII IPA 1" 
                                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none text-sm transition">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">No Absen</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                            <i class="fa-solid fa-list-ol"></i>
                                        </span>
                                        <input type="number" x-model="studentForm.noAbsen" required placeholder="05" 
                                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none text-sm transition">
                                    </div>
                                </div>
                            </div>

                            <div class="pt-2">
                                <button type="submit" 
                                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-indigo-200 transition-all duration-200 flex items-center justify-center gap-2">
                                    <span>Mulai Ujian Now</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </template>

                <!-- STEP 2: TAMPILAN SOAL UJIAN -->
                <template x-if="studentStep === 'exam'">
                    <div class="space-y-6">
                        <!-- Exam Info Bar -->
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center space-x-4">
                                <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
                                    <span x-text="studentForm.nama.charAt(0).toUpperCase()"></span>
                                </div>
                                <div>
                                    <h3 class="font-semibold text-slate-800 leading-tight" x-text="studentForm.nama"></h3>
                                    <p class="text-xs text-slate-500">Kelas: <span x-text="studentForm.kelas"></span> | Absen: <span x-text="studentForm.noAbsen"></span></p>
                                </div>
                            </div>

                            <div class="flex items-center gap-6">
                                <!-- Question Counter -->
                                <div class="text-right">
                                    <span class="text-xs text-slate-400 font-medium block">Progres</span>
                                    <span class="text-sm font-semibold text-slate-700" x-text="`${currentQuestionIndex + 1} dari ${questions.length} Soal`"></span>
                                </div>
                                <!-- Timer -->
                                <div class="bg-amber-50 border border-amber-200 px-4 py-1.5 rounded-lg text-amber-700 flex items-center gap-2">
                                    <i class="fa-regular fa-clock animate-pulse"></i>
                                    <span class="font-mono font-bold text-sm" x-text="formatTime(timerSeconds)"></span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            <!-- Question Content Area (3 Cols) -->
                            <div class="lg:col-span-3 space-y-6">
                                <template x-if="questions.length > 0">
                                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 min-h-[400px] flex flex-col justify-between">
                                        <div>
                                            <!-- Question Header -->
                                            <div class="flex items-center justify-between border-b pb-4 mb-6">
                                                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800">
                                                    Soal No. <span x-text="currentQuestionIndex + 1" class="ml-1"></span>
                                                </span>
                                                <span class="text-xs font-medium text-slate-400 uppercase tracking-wider" x-text="currentQuestion.type === 'pg' ? 'Pilihan Ganda' : 'Essay'"></span>
                                            </div>

                                            <!-- Question Text -->
                                            <p class="text-slate-800 font-medium text-base sm:text-lg mb-6 leading-relaxed" x-text="currentQuestion.text"></p>

                                            <!-- Multiple Choice Options -->
                                            <template x-if="currentQuestion.type === 'pg'">
                                                <div class="space-y-3">
                                                    <template x-for="(opt, idx) in currentQuestion.options" :key="idx">
                                                        <label 
                                                            :class="studentAnswers[currentQuestion.id] === idx ? 'border-indigo-600 bg-indigo-50/60 ring-2 ring-indigo-500/20' : 'border-slate-200 hover:border-slate-300 bg-white'"
                                                            class="flex items-start p-4 rounded-xl border cursor-pointer transition-all duration-200">
                                                            <input type="radio" 
                                                                   :name="'question-' + currentQuestion.id" 
                                                                   :value="idx"
                                                                   x-model="studentAnswers[currentQuestion.id]"
                                                                   class="mt-1 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                                                            <span class="ml-3 font-semibold text-slate-500 mr-2" x-text="String.fromCharCode(65 + idx) + '.'"></span>
                                                            <span class="text-slate-700 text-sm sm:text-base" x-text="opt"></span>
                                                        </label>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Essay Option -->
                                            <template x-if="currentQuestion.type === 'essay'">
                                                <div>
                                                    <textarea 
                                                        x-model="studentAnswers[currentQuestion.id]"
                                                        rows="5" 
                                                        placeholder="Ketik jawaban Anda di sini secara rinci..." 
                                                        class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-700 text-sm sm:text-base outline-none resize-none transition">
                                                    </textarea>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Question Action Buttons -->
                                        <div class="flex items-center justify-between pt-6 border-t mt-8">
                                            <button 
                                                @click="prevQuestion()" 
                                                :disabled="currentQuestionIndex === 0"
                                                :class="currentQuestionIndex === 0 ? 'opacity-50 cursor-not-allowed bg-slate-100 text-slate-400' : 'bg-slate-200 hover:bg-slate-300 text-slate-700'"
                                                class="px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2">
                                                <i class="fa-solid fa-arrow-left"></i>
                                                <span>Sebelumnya</span>
                                            </button>

                                            <template x-if="currentQuestionIndex < questions.length - 1">
                                                <button 
                                                    @click="nextQuestion()" 
                                                    class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl transition flex items-center gap-2 shadow-md">
                                                    <span>Berikutnya</span>
                                                    <i class="fa-solid fa-arrow-right"></i>
                                                </button>
                                            </template>

                                            <template x-if="currentQuestionIndex === questions.length - 1">
                                                <button 
                                                    @click="confirmSubmitExam()" 
                                                    class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl transition flex items-center gap-2 shadow-md">
                                                    <i class="fa-solid fa-paper-plane"></i>
                                                    <span>Selesaikan Ujian</span>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Navigation Sidebar (1 Col) -->
                            <div class="lg:col-span-1">
                                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sticky top-24">
                                    <h4 class="font-semibold text-slate-800 text-sm mb-4 flex items-center gap-2">
                                        <i class="fa-solid fa-table-cells text-indigo-600"></i>
                                        <span>Navigasi Soal</span>
                                    </h4>

                                    <div class="grid grid-cols-5 gap-2">
                                        <template x-for="(q, index) in questions" :key="q.id">
                                            <button 
                                                @click="goToQuestion(index)"
                                                :class="{
                                                    'ring-2 ring-indigo-600 font-bold': currentQuestionIndex === index,
                                                    'bg-emerald-500 text-white border-emerald-600': isQuestionAnswered(q.id) && currentQuestionIndex !== index,
                                                    'bg-slate-100 text-slate-600 hover:bg-slate-200': !isQuestionAnswered(q.id) && currentQuestionIndex !== index
                                                }"
                                                class="h-10 rounded-lg text-xs font-medium flex items-center justify-center transition border">
                                                <span x-text="index + 1"></span>
                                            </button>
                                        </template>
                                    </div>

                                    <div class="mt-6 pt-4 border-t space-y-2 text-xs text-slate-500">
                                        <div class="flex items-center gap-2">
                                            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                                            <span>Sudah dijawab</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="w-3 h-3 rounded-full bg-slate-200 inline-block"></span>
                                            <span>Belum dijawab</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="w-3 h-3 rounded-full ring-2 ring-indigo-600 inline-block"></span>
                                            <span>Sedang dibuka</span>
                                        </div>
                                    </div>

                                    <button 
                                        @click="confirmSubmitExam()"
                                        class="w-full mt-6 py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold rounded-xl text-xs border border-emerald-200 transition">
                                        Kirim Jawaban Ujian
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- STEP 3: HALAMAN SELESAI UJIAN -->
                <template x-if="studentStep === 'completed'">
                    <div class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-xl border border-slate-100 text-center">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800">Ujian Selesai!</h2>
                        <p class="text-slate-500 text-sm mt-2">Terima kasih, <strong x-text="studentForm.nama"></strong>. Jawaban Anda telah tersimpan secara otomatis ke dalam sistem database guru.</p>

                        <div class="my-6 p-4 bg-slate-50 rounded-xl text-left space-y-2 text-xs sm:text-sm text-slate-600 border">
                            <div class="flex justify-between">
                                <span>Kelas / Absen:</span>
                                <span class="font-semibold text-slate-800" x-text="`${studentForm.kelas} / ${studentForm.noAbsen}`"></span>
                            </div>
                            <div class="flex justify-between">
                                <span>Skor Pilihan Ganda:</span>
                                <span class="font-bold text-emerald-600" x-text="`${lastSubmissionScore.scorePG} / 100`"></span>
                            </div>
                        </div>

                        <button 
                            @click="resetStudentForm()" 
                            class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl text-sm transition">
                            Kembali ke Halaman Depan
                        </button>
                    </div>
                </template>
            </div>
        </template>

        <!-- ========================================== -->
        <!-- GURU / ADMIN PANEL VIEW -->
        <!-- ========================================== -->
        <template x-if="role === 'guru'">
            <div class="space-y-6">
                <!-- Top Tabs Navigation -->
                <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2">
                    <button 
                        @click="adminTab = 'results'"
                        :class="adminTab === 'results' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                        class="px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-square-poll-vertical"></i>
                        <span>Hasil & Rekap Jawaban Ujian</span>
                        <span class="ml-1 px-2 py-0.5 rounded-full text-xs" :class="adminTab === 'results' ? 'bg-indigo-800 text-white' : 'bg-slate-200 text-slate-700'" x-text="submissions.length"></span>
                    </button>

                    <button 
                        @click="adminTab = 'questions'"
                        :class="adminTab === 'questions' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                        class="px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-file-pen"></i>
                        <span>Bank Soal Ujian</span>
                        <span class="ml-1 px-2 py-0.5 rounded-full text-xs" :class="adminTab === 'questions' ? 'bg-indigo-800 text-white' : 'bg-slate-200 text-slate-700'" x-text="questions.length"></span>
                    </button>
                </div>

                <!-- TAB 1: HASIL UJIAN SISWA -->
                <template x-if="adminTab === 'results'">
                    <div class="space-y-4">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">Rekapitulasi Hasil Ujian Siswa</h3>
                                <p class="text-xs text-slate-500">Semua jawaban siswa tersimpan otomatis. Unduh sebagai file Excel kapan saja.</p>
                            </div>
                            <button 
                                @click="exportToExcel()"
                                :disabled="submissions.length === 0"
                                :class="submissions.length === 0 ? 'opacity-50 cursor-not-allowed bg-emerald-300' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-100 hover:shadow-lg'"
                                class="px-5 py-2.5 text-white font-semibold text-sm rounded-xl transition flex items-center gap-2 shadow-md">
                                <i class="fa-solid fa-file-excel text-lg"></i>
                                <span>Download Hasil Ujian (Excel)</span>
                            </button>
                        </div>

                        <!-- Data Table -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-600">
                                    <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider border-b">
                                        <tr>
                                            <th class="px-6 py-4">Waktu</th>
                                            <th class="px-6 py-4">Nama Siswa</th>
                                            <th class="px-6 py-4">Kelas</th>
                                            <th class="px-6 py-4">Absen</th>
                                            <th class="px-6 py-4">Skor PG</th>
                                            <th class="px-6 py-4 text-center">Detail Jawaban</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        <template x-for="(sub, idx) in submissions" :key="idx">
                                            <tr class="hover:bg-slate-50/80 transition">
                                                <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-400" x-text="sub.submittedAt"></td>
                                                <td class="px-6 py-4 font-semibold text-slate-800" x-text="sub.nama"></td>
                                                <td class="px-6 py-4" x-text="sub.kelas"></td>
                                                <td class="px-6 py-4" x-text="sub.noAbsen"></td>
                                                <td class="px-6 py-4">
                                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800" x-text="sub.scorePG + ' / 100'"></span>
                                                </td>
                                                <td class="px-6 py-4 text-center">
                                                    <button @click="viewSubmissionDetail(sub)" class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold underline">
                                                        Lihat Detail
                                                    </button>
                                                </td>
                                            </tr>
                                        </template>

                                        <template x-if="submissions.length === 0">
                                            <tr>
                                                <td colspan="6" class="px-6 py-12 text-center text-slate-400">
                                                    <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                                                    Belum ada data siswa yang mengirimkan jawaban.
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- TAB 2: KELOLA BANK SOAL -->
                <template x-if="adminTab === 'questions'">
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-slate-800">Daftar Soal Ujian</h3>
                            <button 
                                @click="openQuestionModal()"
                                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl transition flex items-center gap-2 shadow-sm">
                                <i class="fa-solid fa-plus"></i>
                                <span>Tambah Soal Baru</span>
                            </button>
                        </div>

                        <!-- Question List -->
                        <div class="space-y-4">
                            <template x-for="(q, idx) in questions" :key="q.id">
                                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                    <div class="flex justify-between items-start gap-4">
                                        <div class="flex items-center gap-2">
                                            <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center" x-text="idx + 1"></span>
                                            <span class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-100 text-slate-600" x-text="q.type === 'pg' ? 'Pilihan Ganda' : 'Essay'"></span>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <button @click="editQuestion(q)" class="p-1.5 text-slate-400 hover:text-indigo-600 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                                            <button @click="deleteQuestion(q.id)" class="p-1.5 text-slate-400 hover:text-rose-600 transition"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    </div>

                                    <p class="font-medium text-slate-800" x-text="q.text"></p>

                                    <!-- Render Options if PG -->
                                    <template x-if="q.type === 'pg'">
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                                            <template x-for="(opt, oIdx) in q.options" :key="oIdx">
                                                <div 
                                                    :class="q.correct === oIdx ? 'bg-emerald-50 border-emerald-300 text-emerald-800 font-medium' : 'bg-slate-50 border-slate-200 text-slate-600'"
                                                    class="p-2.5 rounded-lg border text-xs flex items-center justify-between">
                                                    <span x-text="`${String.fromCharCode(65 + oIdx)}. ${opt}`"></span>
                                                    <template x-if="q.correct === oIdx">
                                                        <i class="fa-solid fa-check text-emerald-600"></i>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template x-if="questions.length === 0">
                                <div class="bg-white p-12 rounded-2xl border border-slate-200 text-center text-slate-400">
                                    <i class="fa-solid fa-clipboard-question text-4xl mb-3 block text-slate-300"></i>
                                    <p>Belum ada soal ujian. Klik tombol di atas untuk menambah soal baru.</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>

    </main>

    <!-- MODAL: TAMBAH / EDIT SOAL -->
    <div x-show="showQuestionModal" 
         class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
         x-cloak x-transition>
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-slate-100">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800" x-text="editingQuestionId ? 'Edit Soal' : 'Tambah Soal Baru'"></h3>
                <button @click="showQuestionModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form @submit.prevent="saveQuestion()" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Tipe Soal</label>
                    <select x-model="questionForm.type" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="pg">Pilihan Ganda (PG)</option>
                        <option value="essay">Essay / Isian Singkat</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Pertanyaan / Soal</label>
                    <textarea x-model="questionForm.text" required rows="3" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500" placeholder="Ketik pertanyaan..."></textarea>
                </div>

                <!-- Input Opsi jika PG -->
                <template x-if="questionForm.type === 'pg'">
                    <div class="space-y-3 pt-2">
                        <label class="block text-xs font-semibold uppercase text-slate-600">Pilihan Jawaban & Jawaban Benar</label>
                        <template x-for="(opt, idx) in questionForm.options" :key="idx">
                            <div class="flex items-center space-x-2">
                                <input type="radio" :name="'correctOpt'" :value="idx" x-model.number="questionForm.correct" class="text-indigo-600 focus:ring-indigo-500">
                                <span class="text-xs font-bold text-slate-500 w-4" x-text="String.fromCharCode(65 + idx)"></span>
                                <input type="text" x-model="questionForm.options[idx]" required class="flex-1 p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500" :placeholder="'Opsi ' + String.fromCharCode(65 + idx)">
                            </div>
                        </template>
                        <p class="text-xs text-slate-400 italic">* Pilih salah satu tombol radio untuk menandai jawaban yang benar.</p>
                    </div>
                </template>

                <div class="pt-4 flex justify-end space-x-2">
                    <button type="button" @click="showQuestionModal = false" class="px-4 py-2 bg-slate-100 text-slate-600 font-medium rounded-lg text-sm hover:bg-slate-200">Batal</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white font-medium rounded-lg text-sm hover:bg-indigo-700 shadow-sm">Simpan Soal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: DETAIL JAWABAN SISWA -->
    <div x-show="showDetailModal" 
         class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
         x-cloak x-transition>
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden border border-slate-100 max-h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <div>
                    <h3 class="font-bold text-lg text-slate-800" x-text="selectedSubmission?.nama"></h3>
                    <p class="text-xs text-slate-500" x-text="`Kelas: ${selectedSubmission?.kelas} | Absen: ${selectedSubmission?.noAbsen}`"></p>
                </div>
                <button @click="showDetailModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <template x-for="(q, idx) in questions" :key="q.id">
                    <div class="p-4 rounded-xl border border-slate-200 space-y-2">
                        <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
                            <span x-text="`Soal #${idx + 1} (${q.type.toUpperCase()})`"></span>
                            <template x-if="q.type === 'pg'">
                                <span :class="selectedSubmission?.answers[q.id] === q.correct ? 'text-emerald-600' : 'text-rose-600'">
                                    <i :class="selectedSubmission?.answers[q.id] === q.correct ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark'"></i>
                                    <span x-text="selectedSubmission?.answers[q.id] === q.correct ? ' Benar' : ' Salah'"></span>
                                </span>
                            </template>
                        </div>
                        <p class="text-sm font-medium text-slate-800" x-text="q.text"></p>
                        
                        <div class="text-xs p-3 rounded-lg bg-slate-50 border text-slate-700">
                            <strong>Jawaban Siswa: </strong>
                            <template x-if="q.type === 'pg'">
                                <span x-text="selectedSubmission?.answers[q.id] !== undefined ? `${String.fromCharCode(65 + selectedSubmission?.answers[q.id])}. ${q.options[selectedSubmission?.answers[q.id]]}` : 'Tidak dijawab'"></span>
                            </template>
                            <template x-if="q.type === 'essay'">
                                <span x-text="selectedSubmission?.answers[q.id] || 'Tidak dijawab'"></span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript Logic -->
    <script>
        function examApp() {
            return {
                role: 'siswa', // 'siswa' or 'guru'
                studentStep: 'identity', // 'identity', 'exam', 'completed'
                adminTab: 'results', // 'results', 'questions'

                // Form Data Siswa
                studentForm: {
                    nama: '',
                    kelas: '',
                    noAbsen: ''
                },

                // Exam Timer & State
                timerSeconds: 1800, // 30 Menit
                timerInterval: null,
                currentQuestionIndex: 0,
                studentAnswers: {},
                lastSubmissionScore: { scorePG: 0 },

                // Modals
                showQuestionModal: false,
                editingQuestionId: null,
                questionForm: {
                    type: 'pg',
                    text: '',
                    options: ['', '', '', ''],
                    correct: 0
                },

                showDetailModal: false,
                selectedSubmission: null,

                // Questions and Submissions Data (Saved in LocalStorage)
                questions: [],
                submissions: [],

                initData() {
                    // Default Sample Questions
                    const defaultQuestions = [
                        {
                            id: 1,
                            type: 'pg',
                            text: 'Apa ibu kota dari negara Indonesia saat ini?',
                            options: ['Surabaya', 'Jakarta', 'Bandung', 'Medan'],
                            correct: 1
                        },
                        {
                            id: 2,
                            type: 'pg',
                            text: 'Planet manakah yang dikenal sebagai Planet Merah?',
                            options: ['Venus', 'Yupiter', 'Mars', 'Saturnus'],
                            correct: 2
                        },
                        {
                            id: 3,
                            type: 'essay',
                            text: 'Jelaskan secara singkat proses terjadinya fotosintesis pada tumbuhan hijau!',
                            options: [],
                            correct: null
                        }
                    ];

                    const savedQuestions = localStorage.getItem('edu_questions');
                    if (savedQuestions) {
                        this.questions = JSON.parse(savedQuestions);
                    } else {
                        this.questions = defaultQuestions;
                        this.saveQuestionsToStorage();
                    }

                    const savedSubmissions = localStorage.getItem('edu_submissions');
                    if (savedSubmissions) {
                        this.submissions = JSON.parse(savedSubmissions);
                    }
                },

                switchRole(newRole) {
                    if (this.studentStep === 'exam') {
                        if (!confirm('Ujian sedang berlangsung. Yakin ingin keluar dari tampilan siswa?')) {
                            return;
                        }
                        clearInterval(this.timerInterval);
                        this.studentStep = 'identity';
                    }
                    this.role = newRole;
                },

                saveQuestionsToStorage() {
                    localStorage.setItem('edu_questions', JSON.stringify(this.questions));
                },

                saveSubmissionsToStorage() {
                    localStorage.setItem('edu_submissions', JSON.stringify(this.submissions));
                },

                // Student Exam Actions
                startExam() {
                    if (this.questions.length === 0) {
                        alert('Belum ada soal ujian yang dibuat oleh guru.');
                        return;
                    }
                    this.studentAnswers = {};
                    this.currentQuestionIndex = 0;
                    this.studentStep = 'exam';
                    this.startTimer();
                },

                startTimer() {
                    this.timerSeconds = 1800;
                    clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        if (this.timerSeconds > 0) {
                            this.timerSeconds--;
                        } else {
                            clearInterval(this.timerInterval);
                            alert('Waktu ujian telah habis!');
                            this.submitExam();
                        }
                    }, 1000);
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                },

                get currentQuestion() {
                    return this.questions[this.currentQuestionIndex] || {};
                },

                nextQuestion() {
                    if (this.currentQuestionIndex < this.questions.length - 1) {
                        this.currentQuestionIndex++;
                    }
                },

                prevQuestion() {
                    if (this.currentQuestionIndex > 0) {
                        this.currentQuestionIndex--;
                    }
                },

                goToQuestion(index) {
                    this.currentQuestionIndex = index;
                },

                isQuestionAnswered(questionId) {
                    const ans = this.studentAnswers[questionId];
                    return ans !== undefined && ans !== '';
                },

                confirmSubmitExam() {
                    if (confirm('Apakah Anda yakin ingin menyelesaikan dan mengirimkan jawaban ujian ini?')) {
                        this.submitExam();
                    }
                },

                submitExam() {
                    clearInterval(this.timerInterval);

                    // Calculate PG Score
                    let pgTotal = 0;
                    let pgCorrect = 0;

                    this.questions.forEach(q => {
                        if (q.type === 'pg') {
                            pgTotal++;
                            if (this.studentAnswers[q.id] === q.correct) {
                                pgCorrect++;
                            }
                        }
                    });

                    const scorePG = pgTotal > 0 ? Math.round((pgCorrect / pgTotal) * 100) : 0;
                    this.lastSubmissionScore = { scorePG };

                    // Save Submission Data
                    const now = new Date();
                    const newSubmission = {
                        id: Date.now(),
                        nama: this.studentForm.nama,
                        kelas: this.studentForm.kelas,
                        noAbsen: this.studentForm.noAbsen,
                        answers: { ...this.studentAnswers },
                        scorePG: scorePG,
                        submittedAt: now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                    };

                    this.submissions.push(newSubmission);
                    this.saveSubmissionsToStorage();
                    this.studentStep = 'completed';
                },

                resetStudentForm() {
                    this.studentForm = { nama: '', kelas: '', noAbsen: '' };
                    this.studentStep = 'identity';
                },

                // Question Builder Actions (Guru)
                openQuestionModal() {
                    this.editingQuestionId = null;
                    this.questionForm = {
                        type: 'pg',
                        text: '',
                        options: ['', '', '', ''],
                        correct: 0
                    };
                    this.showQuestionModal = true;
                },

                editQuestion(q) {
                    this.editingQuestionId = q.id;
                    this.questionForm = {
                        type: q.type,
                        text: q.text,
                        options: q.options ? [...q.options] : ['', '', '', ''],
                        correct: q.correct !== undefined ? q.correct : 0
                    };
                    this.showQuestionModal = true;
                },

                saveQuestion() {
                    if (this.editingQuestionId) {
                        const idx = this.questions.findIndex(q => q.id === this.editingQuestionId);
                        if (idx !== -1) {
                            this.questions[idx] = {
                                id: this.editingQuestionId,
                                ...this.questionForm
                            };
                        }
                    } else {
                        const newQ = {
                            id: Date.now(),
                            ...this.questionForm
                        };
                        this.questions.push(newQ);
                    }

                    this.saveQuestionsToStorage();
                    this.showQuestionModal = false;
                },

                deleteQuestion(id) {
                    if (confirm('Yakin ingin menghapus soal ini?')) {
                        this.questions = this.questions.filter(q => q.id !== id);
                        this.saveQuestionsToStorage();
                    }
                },

                viewSubmissionDetail(sub) {
                    this.selectedSubmission = sub;
                    this.showDetailModal = true;
                },

                // Excel Generation using SheetJS
                exportToExcel() {
                    if (this.submissions.length === 0) return;

                    // Build dynamic headers
                    const headers = ['No', 'Waktu Submit', 'Nama Lengkap', 'Kelas', 'No Absen', 'Nilai PG'];
                    
                    // Add columns for each question
                    this.questions.forEach((q, idx) => {
                        headers.push(`Soal ${idx + 1} (${q.type.toUpperCase()})`);
                    });

                    // Build rows
                    const dataRows = this.submissions.map((sub, index) => {
                        const row = [
                            index + 1,
                            sub.submittedAt,
                            sub.nama,
                            sub.kelas,
                            sub.noAbsen,
                            sub.scorePG
                        ];

                        // Answers
                        this.questions.forEach(q => {
                            const userAns = sub.answers[q.id];
                            if (q.type === 'pg') {
                                if (userAns !== undefined && userAns !== null) {
                                    const optChar = String.fromCharCode(65 + userAns);
                                    const optText = q.options[userAns] || '';
                                    const isCorrect = userAns === q.correct ? '[BENAR]' : '[SALAH]';
                                    row.push(`${optChar}. ${optText} ${isCorrect}`);
                                } else {
                                    row.push('Tidak Dijawab');
                                }
                            } else {
                                row.push(userAns || 'Tidak Dijawab');
                            }
                        });

                        return row;
                    });

                    // Combine Headers and Rows
                    const excelData = [headers, ...dataRows];

                    // Create Worksheet and Workbook
                    const worksheet = XLSX.utils.aoa_to_sheet(excelData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, 'Hasil Ujian');

                    // Save File
                    const fileName = `Hasil_Ujian_Online_${new Date().toISOString().slice(0,10)}.xlsx`;
                    XLSX.writeFile(workbook, fileName);
                }
            }
        }
    </script>
</body>
